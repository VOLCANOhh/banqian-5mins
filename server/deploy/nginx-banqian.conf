# 班前五分钟 API 子域名 —— nginx server 块
# 用法：替换 api.你的域名.com，放到 /etc/nginx/sites-available/banqian-api
# 不影响现有网站：独立 server 块，只接 api 子域名
# SSL 证书由 certbot 签（见 deploy.md 第 4 步）；若主域名证书是泛域名证书可复用

server {
    listen 443 ssl;
    server_name api.YOUR_DOMAIN.com;

    # certbot 会自动填/改这两行；先用占位，跑 certbot --nginx 后自动生效
    ssl_certificate     /etc/letsencrypt/live/api.YOUR_DOMAIN.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.YOUR_DOMAIN.com/privkey.pem;

    client_max_body_size 10m;   # 语音文件上传

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}

# HTTP 跳 HTTPS（certbot 一般会自动加；手加保底）
server {
    listen 80;
    server_name api.YOUR_DOMAIN.com;
    return 301 https://$host$request_uri;
}
